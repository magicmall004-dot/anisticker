<!DOCTYPE html>
<html>
<head><meta charset="utf-8" /></head>
<body>
<script>
  // GitHub Pages serves this file for any unknown path.
  // We redirect back to index.html, preserving the intended path
  // so React Router can handle it on load.
  var base = '/anisticker';
  var path = window.location.pathname.replace(base, '') || '/';
  var search = window.location.search;
  var hash = window.location.hash;
  window.location.replace(
    base + '/?redirect=' + encodeURIComponent(path + search + hash)
  );
</script>
</body>
</html>
